name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native sanitizers and Firestore emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc libcurl4-openssl-dev libjson-c-dev libssl-dev libpq-dev
      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPGFIRE_SANITIZE=ON -DCURL_LIBRARY=/usr/lib/x86_64-linux-gnu/libcurl.so -DCURL_INCLUDE_DIR=/usr/include/x86_64-linux-gnu
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Check Python syntax
        run: python3 -m compileall -q tools tests
      - name: Download verified Firestore emulator
        run: |
          mkdir -p .cache artifacts
          curl --fail --location --retry 3 https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar --output .cache/firestore.jar
          echo '9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c  .cache/firestore.jar' | sha256sum --check
      - name: Run storage and fencing tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:58080
          PGFIRE_PROJECT: pgfire-local
          PGFIRE_NAMESPACE: ci-fencing
        run: |
          java -Xmx1g -jar .cache/firestore.jar --host=127.0.0.1 --port=58080 --project_id=pgfire-local > artifacts/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          python3 - <<'PY'
          import socket
          import time
          for attempt in range(60):
              try:
                  with socket.create_connection(('127.0.0.1', 58080), timeout=1):
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Firestore emulator did not start')
          PY
          build/test_fencing
          python3 tests/integration/test_store.py
      - name: Emulator diagnostics
        if: failure()
        run: cat artifacts/emulator.log 2>/dev/null || true

  container:
    name: PostgreSQL 17 image and Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate local stack configuration
        run: docker compose config --quiet
      - name: Build image, PostgreSQL guard, and codec test
        run: docker build --tag pgfire:ci .
